name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Run through the package scripts so CI and local stay in step - inlining
      # the commands here is how scripts/*.mjs went unlinted after package.json
      # had already been fixed to cover it.
      - name: Lint HTML
        run: npm run lint:html

      - name: Lint CSS
        run: npm run lint:css

      - name: Lint JavaScript
        run: npm run lint:js

      # Fails if style.css/script.js changed without re-running `npm run stamp`,
      # which would deploy new HTML pointing at a stale, still-cached asset.
      - name: Check asset cache-busting stamps are current
        run: npm run lint:assets
